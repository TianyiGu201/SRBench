name: Private static build

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build static frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /SRBench/
          VITE_DATA_BASE_URL: http://127.0.0.1:7801
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: srbench-private-preview
          path: front/dist
          retention-days: 7
