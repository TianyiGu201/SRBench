name: Deploy SRBench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        working-directory: front
        run: npm ci
      - name: Check TypeScript
        working-directory: front
        run: npx tsc --noEmit
      - name: Build frontend for GitHub Pages
        working-directory: front
        env:
          VITE_BASE_PATH: /SRBench/
          VITE_DATA_BASE_URL: https://pub-8360a1ebefc848bdb9ca66b5f1502de3.r2.dev
          VITE_DATA_COMPRESSION: gzip
        run: npm run build
      - name: Verify GitHub Pages asset paths
        run: |
          test -f front/dist/index.html
          grep -q '/SRBench/assets/' front/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
